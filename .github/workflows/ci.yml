name: MediVision Enterprise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-test-and-build:
    name: Frontend Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Vitest Unit & Integration Tests
        run: |
          cd frontend
          npm test
      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  backend-test:
    name: ASP.NET Core xUnit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore backend/MediVision.sln
      - name: Build solution
        run: dotnet build backend/MediVision.sln --no-restore -c Release
      - name: Run xUnit Test Suite
        run: dotnet test backend/MediVision.sln --no-build -c Release --verbosity normal

  ai-service-test:
    name: Python AI Pipeline & Model Validation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
      - name: Run PyTest Suite with Coverage
        run: |
          cd ai-service
          pytest tests/test_ai_pipeline.py --cov=app --cov-report=xml --cov-report=term

